# Sørpedia locally: docker compose up -d, then http://localhost:8080
# Ollama runs on your machine (not in Docker): ollama pull qwen2.5:7b-instruct
services:
  app:
    build: { context: ., dockerfile: docker/Dockerfile }
    # This machine only. Remove "127.0.0.1:" to open the demo to others on the network.
    ports: ["127.0.0.1:${PORT:-8080}:80"]
    volumes: [".:/var/www/app"]
    environment:
      DB_HOST: db
      DB_NAME: sorpedia
      DB_USER: sorpedia
      DB_PASS: sorpedia
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      WC_WEBHOOK_SECRET: ${WC_WEBHOOK_SECRET:-}
      API_ASK_LIMIT: ${API_ASK_LIMIT:-10}
      API_QUESTION_LIMIT: ${API_QUESTION_LIMIT:-60}
      SOREN_FIRST_TOKEN_S: 120
      SOREN_MAX_THINK_S: 90
      SOREN_MAX_ANSWER_S: 480
      SOREN_NUM_CTX: ${SOREN_NUM_CTX:-8192}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [db]
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: sorpedia
      MARIADB_USER: sorpedia
      MARIADB_PASSWORD: sorpedia
      MARIADB_ROOT_PASSWORD: sorpedia-root
    volumes: ["dbdata:/var/lib/mysql"]
volumes:
  dbdata:
